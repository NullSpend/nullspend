name: Publish Python SDK to PyPI

on:
  push:
    tags:
      - "python-sdk-v*"

jobs:
  test:
    name: Test before publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/sdk-python/pyproject.toml

      - name: Install dependencies
        working-directory: packages/sdk-python
        run: pip install -e ".[dev]"

      - name: Pricing data sync check
        run: |
          if ! diff -q packages/cost-engine/src/pricing-data.json packages/sdk-python/src/nullspend/_pricing_data.json; then
            echo "::error::Pricing data out of sync. Run: cp packages/cost-engine/src/pricing-data.json packages/sdk-python/src/nullspend/_pricing_data.json"
            exit 1
          fi

      - name: Run tests
        working-directory: packages/sdk-python
        run: python -m pytest tests/ -v --tb=short

  version-check:
    name: Verify tag matches pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract versions
        id: versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#python-sdk-v}"
          PYPROJECT_VERSION=$(python -c "
          import re
          with open('packages/sdk-python/pyproject.toml') as f:
              match = re.search(r'version\s*=\s*\"([^\"]+)\"', f.read())
              print(match.group(1))
          ")
          echo "tag=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "pyproject=$PYPROJECT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check version match
        run: |
          if [ "${{ steps.versions.outputs.tag }}" != "${{ steps.versions.outputs.pyproject }}" ]; then
            echo "::error::Tag version (${{ steps.versions.outputs.tag }}) does not match pyproject.toml (${{ steps.versions.outputs.pyproject }})"
            exit 1
          fi
          echo "Version match: ${{ steps.versions.outputs.tag }}"

  publish:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test, version-check]
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing
      contents: read   # Required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        working-directory: packages/sdk-python
        run: python -m build

      - name: Verify package
        working-directory: packages/sdk-python
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/sdk-python/dist/
