name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @nullspend/db
        run: pnpm db:build

      - name: Build @nullspend/cost-engine
        run: pnpm cost-engine:build

      - name: Build @nullspend/sdk
        run: pnpm sdk:build

      - name: Build @nullspend/claude-agent
        run: pnpm claude-agent:build

      - name: Build @nullspend/docs
        run: pnpm docs-mcp:build

      - name: Lint
        run: pnpm lint

      - name: Proxy tests
        run: pnpm proxy:test

      - name: SDK tests
        run: pnpm sdk:test

      - name: Cost engine tests
        run: pnpm cost-engine:test

      - name: Claude agent tests
        run: pnpm claude-agent:test

      - name: MCP server tests
        run: pnpm mcp:test

      - name: DB tests
        run: pnpm db:test

      - name: MCP proxy tests
        run: pnpm mcp-proxy:test

      - name: Docs MCP tests
        run: pnpm docs-mcp:test

  python-sdk:
    name: Python SDK (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/sdk-python/pyproject.toml

      - name: Install dependencies
        working-directory: packages/sdk-python
        run: pip install -e ".[dev]"

      - name: Pricing data sync check
        run: |
          if ! diff -q packages/cost-engine/src/pricing-data.json packages/sdk-python/src/nullspend/_pricing_data.json; then
            echo "::error::Pricing data out of sync. Run: cp packages/cost-engine/src/pricing-data.json packages/sdk-python/src/nullspend/_pricing_data.json"
            exit 1
          fi

      - name: Run tests
        working-directory: packages/sdk-python
        run: python -m pytest tests/ -v --tb=short
